name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast-failing gates. Formatting drift and known vulnerabilities should stop a
  # PR before the three-platform matrix spends time on it.
  check:
    name: format, vet, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # vet and govulncheck compile every package, including the desktop app,
      # so this job needs the same native libraries the build jobs do.
      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          pc=/usr/lib/x86_64-linux-gnu/pkgconfig
          for lib in webkit2gtk javascriptcoregtk; do
            if [ ! -f "$pc/${lib}-4.0.pc" ] && [ -f "$pc/${lib}-4.1.pc" ]; then
              sudo ln -s "$pc/${lib}-4.1.pc" "$pc/${lib}-4.0.pc"
            fi
          done

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # This tool handles bearer credentials, so a known-vulnerable dependency
      # is a release blocker rather than a nice-to-know.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # systray binds Ayatana AppIndicator; webview binds GTK and WebKitGTK.
      #
      # webview declares webkit2gtk-4.0, but Ubuntu 24.04 ships only 4.1, which
      # is API-compatible for this use. Aliasing the pkg-config files lets the
      # build find it without pinning an older, soon-to-be-retired runner image.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          pc=/usr/lib/x86_64-linux-gnu/pkgconfig
          for lib in webkit2gtk javascriptcoregtk; do
            if [ ! -f "$pc/${lib}-4.0.pc" ] && [ -f "$pc/${lib}-4.1.pc" ]; then
              sudo ln -s "$pc/${lib}-4.1.pc" "$pc/${lib}-4.0.pc"
            fi
          done

      - name: Test
        run: go test ./... -count=1

      # The race detector needs cgo and a C toolchain. Running it on Linux keeps
      # that requirement to one runner instead of all three.
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test ./... -count=1 -race
        env:
          CGO_ENABLED: '1'

      - name: Build CLI
        run: go build ./cmd/ccm

      # The tray and the desktop app use cgo, so both are built on each native
      # runner rather than cross-compiled.
      - name: Build tray
        run: go build ./cmd/ccm-tray

      - name: Build desktop app
        run: go build ./cmd/ccm-gui

      # The release ships an Intel build of both cgo programs, cross-compiled
      # from this Apple Silicon runner. That path is exercised here on every
      # push rather than only at tag time, because a cgo cross-compile can fail
      # for reasons a native build never reveals, and discovering it during a
      # release is discovering it too late.
      # The Keychain-dependent tests skip rather than fail when the login
      # keychain is locked, which is correct for a developer over SSH but means
      # a plain "ok" no longer distinguishes "exercised" from "skipped". This
      # runner is the one place the macOS backend is actually proven, so if it
      # ever starts skipping, that coverage disappears silently. Fail instead.
      - name: Keychain paths must run here, not skip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/store/ ./internal/vault/ -count=1 -v \
            -run 'Keychain|SaveAndReopenRoundTrip|EnvelopeRecordsTheSealer' \
            | tee /tmp/keychain.log
          if grep -q -- '--- SKIP' /tmp/keychain.log; then
            echo "::error::Keychain tests skipped on the macOS runner, so the macOS backend is no longer covered anywhere"
            grep -- '--- SKIP' /tmp/keychain.log
            exit 1
          fi
          echo "Keychain paths were exercised, not skipped."

      - name: Cross-compile for Intel Macs
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
          CGO_CFLAGS: '-arch x86_64'
          CGO_LDFLAGS: '-arch x86_64'
        run: |
          go build -o /tmp/ccm-tray-amd64 ./cmd/ccm-tray
          go build -o /tmp/ccm-gui-amd64 ./cmd/ccm-gui
          file /tmp/ccm-tray-amd64 /tmp/ccm-gui-amd64
          # Assert the architecture rather than trusting the toolchain: a
          # silently ignored -arch would produce arm64 binaries named amd64.
          for f in /tmp/ccm-tray-amd64 /tmp/ccm-gui-amd64; do
            if ! file "$f" | grep -q 'x86_64'; then
              echo "::error::$f is not x86_64; the Intel build would be broken"
              exit 1
            fi
          done

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
        working-directory: extension

      - name: Compile
        run: npm run compile
        working-directory: extension

      # On a tag, stamp the release version into the VSIX so the installed
      # extension reports the same version as the release it came from. On a
      # branch push there is no version to stamp, so package.json is left alone.
      - name: Package VSIX
        shell: bash
        working-directory: extension
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "stamping extension version ${version}"
            npm version "${version}" --no-git-tag-version --allow-same-version
          fi
          npx --yes @vscode/vsce package --out ccm-extension.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension/ccm-extension.vsix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Packaging smoke tests. Run on every push and publish nothing.
  #
  # The release packaging jobs only run on a tag, so without these the first
  # time anyone learns that build-pkg.sh has a typo or that a dependency name
  # changed is during a release. This workflow already makes that argument for
  # the Intel cross-compile: discovering it during a release is discovering it
  # too late. Packaging is worse, because the failure is not a compile error
  # but an installer that builds and then does the wrong thing.
  #
  # They call exactly the scripts the release jobs call, so the only thing
  # duplicated is the YAML around them.
  # ---------------------------------------------------------------------------

  package-smoke-linux:
    name: package smoke (deb)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          pc=/usr/lib/x86_64-linux-gnu/pkgconfig
          for lib in webkit2gtk javascriptcoregtk; do
            if [ ! -f "$pc/${lib}-4.0.pc" ] && [ -f "$pc/${lib}-4.1.pc" ]; then
              sudo ln -s "$pc/${lib}-4.1.pc" "$pc/${lib}-4.0.pc"
            fi
          done

      - name: Build binaries and the package
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/ccm      ./cmd/ccm
          CGO_ENABLED=1 go build -o bin/ccm-tray ./cmd/ccm-tray
          CGO_ENABLED=1 go build -o bin/ccm-gui  ./cmd/ccm-gui
          CCM_SRCDIR=bin CCM_OUTDIR=dist sh packaging/linux/build-deb.sh

      - name: Install on a clean Ubuntu and verify
        run: |
          docker run --rm -v "$PWD/dist:/out:ro" ubuntu:24.04 bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            for lib in libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1; do
              if dpkg -s "$lib" >/dev/null 2>&1; then
                echo "::error::$lib is already installed; this check proves nothing"; exit 1
              fi
            done
            apt-get update -qq
            apt-get install -y -qq desktop-file-utils >/dev/null
            apt-get install -y /out/ccm-linux-amd64.deb
            ccm --version
            desktop-file-validate /usr/share/applications/ccm.desktop
            desktop-file-validate /usr/share/applications/ccm-tray.desktop
            ccm autostart status | grep -q "/usr/bin/ccm-tray"
            for p in ccm-tray ccm-gui; do
              if ldd "/usr/bin/$p" | grep "not found"; then
                echo "::error::$p has unresolved shared libraries"; exit 1
              fi
            done
            apt-get purge -y -qq ccm >/dev/null
            test ! -e /usr/bin/ccm
          '

  package-smoke-macos:
    name: package smoke (pkg)
    needs: [check]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Both slices, so the lipo path and the universal assertion are the same
      # ones the release job runs rather than a simplified stand-in.
      - name: Build both architectures
        run: |
          mkdir -p bin
          for prog in ccm ccm-tray ccm-gui; do
            for arch in arm64 amd64; do
              case "$arch" in
                amd64) cflags="-arch x86_64" ;;
                arm64) cflags="-arch arm64" ;;
              esac
              CGO_ENABLED=1 GOARCH="$arch" CGO_CFLAGS="$cflags" CGO_LDFLAGS="$cflags" \
                go build -o "bin/$prog-darwin-$arch" "./cmd/$prog"
            done
          done
          ls -l bin

      - name: Build the package
        run: CCM_SRCDIR=bin CCM_OUTDIR=dist sh packaging/macos/build-pkg.sh

      - name: Install, verify, uninstall
        run: |
          set -eu
          sudo installer -pkg dist/ccm-macos.pkg -target /
          test -L /usr/local/bin/ccm
          /usr/local/bin/ccm --version

          plutil -extract LSUIElement raw \
            "/Applications/Claude Code Accounts Menu Bar.app/Contents/Info.plist"
          if plutil -extract LSUIElement raw \
               "/Applications/Claude Code Accounts.app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "::error::the desktop app sets LSUIElement; it would have no Dock icon"
            exit 1
          fi

          status="$(/usr/local/bin/ccm autostart status)"
          echo "$status"
          echo "$status" | grep -q "/Applications/Claude Code Accounts Menu Bar.app/Contents/MacOS/ccm-tray" || {
            echo "::error::internal/locate and build-pkg.sh disagree on bundle names"
            exit 1
          }

          sudo /usr/local/bin/ccm-uninstall
          test ! -e "/Applications/Claude Code Accounts.app"
          test ! -e /usr/local/bin/ccm

  package-smoke-windows:
    name: package smoke (setup.exe)
    needs: [check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install NSIS
        run: choco install nsis --version=3.10 -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Build -SrcDir bin -OutDir dist `
            -MakeNsis "C:\Program Files (x86)\NSIS\makensis.exe"

      - name: Install, verify, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "$env:RUNNER_TEMP\ccm-smoke"
          $p = Start-Process -FilePath dist\ccm-setup-windows.exe -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          & "$target\ccm.exe" --version
          & "$target\ccm.exe" autostart status

          $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kind = $k.GetValueKind('Path'); $k.Close()
          if ($kind -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) {
            throw "user PATH was downgraded to $kind"
          }

          Start-Process -FilePath "$target\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$target\ccm.exe") { throw 'uninstall left the executables behind' }

  # ---------------------------------------------------------------------------
  # Release. Runs only for v* tags.
  #
  # Third-party actions are deliberately avoided in these jobs. For a tool that
  # handles bearer credentials, every action granted contents:write is supply
  # chain risk, so publishing uses the preinstalled GitHub CLI instead.
  # ---------------------------------------------------------------------------

  release-cli:
    name: build CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, extension]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The CLI is pure Go, so every target cross-compiles from one runner.
      #
      # Asset names deliberately omit the version. GitHub's
      # /releases/latest/download/<name> redirect only resolves a fixed
      # filename, and that redirect is what makes the one-line installer work
      # without an API call or a rate limit. The version is compiled in and
      # reported by `ccm --version`.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME}"
          name="ccm-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then name="${name}.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${name}" ./cmd/ccm

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release-tray:
    name: build tray ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, extension]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          # Intel Macs are still in service; a 2018 model is x86_64 and cannot
          # run an arm64 build at all. Cross-compiled from the Apple Silicon
          # runner, which is possible because the macOS SDK ships universal
          # framework stubs and clang targets either architecture.
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev

      # The tray needs cgo for Cocoa and AppIndicator. Linux and Windows are
      # built natively; macOS builds both architectures from one runner using
      # clang's -arch flag, since Go alone cannot retarget a cgo build.
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME}"
          name="ccm-tray-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then name="${name}.exe"; fi
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            arch=x86_64
            [ "${{ matrix.goarch }}" = "arm64" ] && arch=arm64
            export CGO_CFLAGS="-arch ${arch}" CGO_LDFLAGS="-arch ${arch}"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${name}" ./cmd/ccm-tray
          file "dist/${name}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: tray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release-gui:
    name: build desktop app ${{ matrix.goos }}/${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, extension]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          # See the tray job: Intel Macs are still in service and need their
          # own build, cross-compiled from the Apple Silicon runner.
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          pc=/usr/lib/x86_64-linux-gnu/pkgconfig
          for lib in webkit2gtk javascriptcoregtk; do
            if [ ! -f "$pc/${lib}-4.0.pc" ] && [ -f "$pc/${lib}-4.1.pc" ]; then
              sudo ln -s "$pc/${lib}-4.1.pc" "$pc/${lib}-4.0.pc"
            fi
          done

      # webview binds the platform's own browser engine through cgo. Linux and
      # Windows build natively; macOS builds both architectures from one runner
      # via clang's -arch flag. -H=windowsgui suppresses the console window that
      # would otherwise open behind the app on Windows.
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME}"
          name="ccm-gui-${{ matrix.goos }}-${{ matrix.goarch }}"
          ldflags="-s -w -X main.version=${version}"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            arch=x86_64
            [ "${{ matrix.goarch }}" = "arm64" ] && arch=arm64
            export CGO_CFLAGS="-arch ${arch}" CGO_LDFLAGS="-arch ${arch}"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            name="${name}.exe"
            ldflags="${ldflags} -H=windowsgui"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "${ldflags}" -o "dist/${name}" ./cmd/ccm-gui

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Installers.
  #
  # These consume the binaries the release-* jobs produced rather than building
  # their own, so what a user installs is byte-identical to the loose binary
  # published beside it under the same checksum.
  # ---------------------------------------------------------------------------

  package-windows:
    name: Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-cli, release-tray, release-gui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Collect Windows binaries
        uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: '*-windows-amd64'

      # The installer expects the three programs under their plain names; the
      # release assets carry a platform suffix.
      - name: Stage binaries under their installed names
        shell: bash
        run: |
          mkdir -p bin
          cp staging/cli-windows-amd64/ccm-windows-amd64.exe        bin/ccm.exe
          cp staging/tray-windows-amd64/ccm-tray-windows-amd64.exe  bin/ccm-tray.exe
          cp staging/gui-windows-amd64/ccm-gui-windows-amd64.exe    bin/ccm-gui.exe
          ls -l bin

      # Pinned rather than floating. This workflow avoids third-party actions
      # for supply-chain reasons, and an unpinned package feed is the same
      # exposure by another route.
      - name: Install NSIS
        run: choco install nsis --version=3.10 -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 `
            -Version "${env:GITHUB_REF_NAME}" `
            -SrcDir bin `
            -OutDir dist `
            -MakeNsis "C:\Program Files (x86)\NSIS\makensis.exe"

      # Proves the installer actually installs rather than merely compiling.
      # A silent install writes to this runner's own profile, so it is
      # disposable, and the uninstall half is checked in the same breath.
      - name: Install, verify, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "$env:RUNNER_TEMP\ccm-smoke"
          $p = Start-Process -FilePath dist\ccm-setup-windows.exe -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

          foreach ($f in 'ccm.exe','ccm-tray.exe','ccm-gui.exe','uninstall.exe') {
            if (-not (Test-Path "$target\$f")) { throw "installer did not write $f" }
          }
          & "$target\ccm.exe" --version
          & "$target\ccm.exe" autostart status

          # The user PATH must stay REG_EXPAND_SZ. Rewriting it as REG_SZ stops
          # the system expanding %VAR% entries it contains, which silently
          # breaks unrelated tools and is exactly what WriteRegExpandStr exists
          # to prevent.
          $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kind = $k.GetValueKind('Path')
          $k.Close()
          if ($kind -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) {
            throw "user PATH was downgraded to $kind"
          }

          Start-Process -FilePath "$target\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$target\ccm.exe") { throw 'uninstall left the executables behind' }
          if (Test-Path 'HKCU:\Software\ccm') { throw 'uninstall left registry state behind' }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/ccm-setup-windows.exe
          if-no-files-found: error

  package-linux:
    name: Debian package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-cli, release-tray, release-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # amd64 only, because release-tray and release-gui build the two cgo
      # programs for linux/amd64 alone. A CLI-only arm64 package would install
      # menu entries for applications it does not ship.
      - name: Collect Linux binaries
        uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: '*-linux-amd64'

      - name: Stage binaries under their installed names
        run: |
          mkdir -p bin
          cp staging/cli-linux-amd64/ccm-linux-amd64        bin/ccm
          cp staging/tray-linux-amd64/ccm-tray-linux-amd64  bin/ccm-tray
          cp staging/gui-linux-amd64/ccm-gui-linux-amd64    bin/ccm-gui
          chmod +x bin/*
          ls -l bin

      - name: Build the package
        env:
          CCM_VERSION: ${{ github.ref_name }}
          CCM_SRCDIR: bin
          CCM_OUTDIR: dist
        run: sh packaging/linux/build-deb.sh

      # Installed in a clean container rather than on the runner. The runner
      # already carries GTK and WebKit, so installing there would prove the
      # package unpacks but not that its Depends line is correct, and a wrong
      # dependency is invisible until a user on a plain system hits it.
      - name: Install on a clean Ubuntu and verify
        run: |
          docker run --rm -v "$PWD/dist:/out:ro" ubuntu:24.04 bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive

            # The test is worthless if these are already present.
            for lib in libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1; do
              if dpkg -s "$lib" >/dev/null 2>&1; then
                echo "::error::$lib is already installed; this check proves nothing"
                exit 1
              fi
            done

            apt-get update -qq
            apt-get install -y -qq desktop-file-utils >/dev/null
            apt-get install -y /out/ccm-linux-amd64.deb

            ccm --version
            desktop-file-validate /usr/share/applications/ccm.desktop
            desktop-file-validate /usr/share/applications/ccm-tray.desktop

            # Proves internal/locate resolves siblings from the installed
            # layout, not just in tests.
            ccm autostart status | grep -q "/usr/bin/ccm-tray"

            # The real assertion behind Depends: a missing library shows up
            # here rather than as a loader error on a user machine.
            for p in ccm-tray ccm-gui; do
              if ldd "/usr/bin/$p" | grep "not found"; then
                echo "::error::$p has unresolved shared libraries"
                exit 1
              fi
            done

            apt-get purge -y -qq ccm >/dev/null
            test ! -e /usr/bin/ccm
            echo "clean install, verify and purge all passed"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/ccm-linux-amd64.deb
          if-no-files-found: error

  package-macos:
    name: macOS installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-cli, release-tray, release-gui]
    runs-on: macos-latest
    # Lifted to job level because the secrets context is NOT available in a
    # step-level if:. Referenced there it evaluates to an empty string rather
    # than failing, so every signing step below would quietly stay skipped even
    # after the credentials were added, and the first sign that anything was
    # wrong would be users still seeing an unidentified-developer warning.
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Collect macOS binaries
        uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: '*-darwin-*'

      - name: Flatten the binaries
        run: |
          mkdir -p bin
          find staging -type f -exec cp {} bin/ \;
          ls -l bin

      # Signing and notarization are wired but inert: every step below is a
      # no-op until the secrets exist, so the pipeline ships an unsigned
      # package today and a notarized one the day a Developer ID is added,
      # with no change to how anything is built.
      - name: Import the Developer ID certificates
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(openssl rand -hex 20)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the package
        env:
          CCM_VERSION: ${{ github.ref_name }}
          CCM_SRCDIR: bin
          CCM_OUTDIR: dist
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: sh packaging/macos/build-pkg.sh

      - name: Notarize and staple
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/ccm-macos.pkg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple dist/ccm-macos.pkg
          xcrun stapler validate dist/ccm-macos.pkg

      # A thin package installs and then cannot launch on the architecture it
      # is missing, and the failure surfaces on a user's machine rather than
      # here. The Intel Mac used for manual verification can only ever produce
      # an x86_64 slice, so this runner is the only place both are checked.
      - name: Both architectures must be present
        run: |
          pkgutil --expand-full dist/ccm-macos.pkg "$RUNNER_TEMP/expanded"
          ok=1
          for prog in \
            "$RUNNER_TEMP/expanded/gui.pkg/Payload/Applications/Claude Code Accounts.app/Contents/MacOS/ccm-gui" \
            "$RUNNER_TEMP/expanded/gui.pkg/Payload/Applications/Claude Code Accounts.app/Contents/MacOS/ccm" \
            "$RUNNER_TEMP/expanded/tray.pkg/Payload/Applications/Claude Code Accounts Menu Bar.app/Contents/MacOS/ccm-tray"
          do
            archs="$(lipo -archs "$prog")"
            echo "$(basename "$prog"): $archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "::error::$(basename "$prog") is not universal ($archs)"; ok=0 ;;
            esac
          done
          [ "$ok" -eq 1 ]

      # Proves the package installs and that the two bundles can find each
      # other once installed, which is the only end-to-end check that the
      # bundle names in internal/locate and in build-pkg.sh actually agree.
      - name: Install, verify, uninstall
        run: |
          set -eu
          sudo installer -pkg dist/ccm-macos.pkg -target /

          test -d "/Applications/Claude Code Accounts.app"
          test -d "/Applications/Claude Code Accounts Menu Bar.app"
          test -L /usr/local/bin/ccm

          /usr/local/bin/ccm --version

          plutil -lint "/Applications/Claude Code Accounts.app/Contents/Info.plist"
          plutil -lint "/Applications/Claude Code Accounts Menu Bar.app/Contents/Info.plist"

          # The menu bar app must not claim a Dock tile, and the desktop app
          # must not be hidden from it. This is the whole reason for two
          # bundles rather than one.
          plutil -extract LSUIElement raw \
            "/Applications/Claude Code Accounts Menu Bar.app/Contents/Info.plist"
          if plutil -extract LSUIElement raw \
               "/Applications/Claude Code Accounts.app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "::error::the desktop app sets LSUIElement; it would have no Dock icon"
            exit 1
          fi

          # The CLI is reached through a symlink in /usr/local/bin, so this
          # also exercises the EvalSymlinks step in internal/locate.
          status="$(/usr/local/bin/ccm autostart status)"
          echo "$status"
          echo "$status" | grep -q "/Applications/Claude Code Accounts Menu Bar.app/Contents/MacOS/ccm-tray" || {
            echo "::error::the CLI cannot find the tray in its bundle; internal/locate and build-pkg.sh disagree on bundle names"
            exit 1
          }

          sudo /usr/local/bin/ccm-uninstall
          test ! -e "/Applications/Claude Code Accounts.app"
          test ! -e "/Applications/Claude Code Accounts Menu Bar.app"
          test ! -e /usr/local/bin/ccm
          echo "install, verify and uninstall all passed"

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/ccm-macos.pkg
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-cli, release-tray, release-gui, package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Needed by the packaging-manifest updater below.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Flatten and checksum
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist
          echo "Release assets:"
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME}"
          notes="$(mktemp)"
          {
            echo "## Install"
            echo
            echo "| Platform | Download | Notes |"
            echo "|---|---|---|"
            echo "| Windows | \`ccm-setup-windows.exe\` | Per-user, no administrator rights |"
            echo "| macOS | \`ccm-macos.pkg\` | Installs into /Applications; asks for your password |"
            echo "| Ubuntu, Debian | \`ccm-linux-amd64.deb\` | \`sudo apt install ./ccm-linux-amd64.deb\` |"
            echo
            echo "Each installs the command line tool, the desktop app and the tray app, and"
            echo "adds \`ccm\` to your \`PATH\`. Run \`ccm init\` once afterwards to pin your"
            echo "Claude Code config directory."
            echo
            echo "### These builds are not signed yet"
            echo
            echo "Both operating systems will warn about that, and the warning is expected."
            echo "Verify the download against \`SHA256SUMS\` instead of trusting the publisher name."
            echo
            echo "**macOS** refuses to open an unsigned package from Finder. Install it from"
            echo "Terminal:"
            echo '```'
            echo "sudo installer -pkg ~/Downloads/ccm-macos.pkg -target /"
            echo '```'
            echo
            echo "**Windows** shows \"Windows protected your PC\". Choose **More info**, then"
            echo "**Run anyway**."
            echo
            echo "### Single binary"
            echo
            echo "If you only want the CLI, download the file for your platform, verify it,"
            echo "rename it to \`ccm\` (or \`ccm.exe\`) and put it on your \`PATH\`."
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "On macOS and Linux, mark it executable: \`chmod +x ccm\`."
            echo
            echo "\`ccm-tray\` and \`ccm-gui\` need cgo and ship only for linux/amd64,"
            echo "darwin/amd64, darwin/arm64 and windows/amd64. Other platforms can build them"
            echo "from source."
            echo
            echo "### Uninstall"
            echo
            echo "Windows: Settings > Apps. macOS: \`sudo ccm-uninstall\`. Debian: \`sudo apt remove ccm\`."
            echo "All three keep your saved accounts."
            echo
            echo "### VS Code extension"
            echo
            echo "\`ccm-extension.vsix\` installs with:"
            echo '```'
            echo "code --install-extension ccm-extension.vsix"
            echo '```'
          } > "$notes"

          gh release create "$version" \
            --title "$version" \
            --notes-file "$notes" \
            --verify-tag \
            dist/*

      # Package manifests are updated after the release exists, because they
      # embed the published checksums. This pushes to main, which re-runs the
      # check and test jobs but not the release jobs, since those are gated on
      # a tag ref.
      - name: Update Scoop manifest and Homebrew formula
        run: |
          # Update on top of main rather than the detached tag checkout, so the
          # commit has somewhere to land.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          go run ./scripts/updatepackaging "${GITHUB_REF_NAME}" dist/SHA256SUMS

          if git diff --quiet -- packaging/; then
            echo "manifests already current"
            exit 0
          fi
          git add packaging/
          git commit -m "Update packaging manifests for ${GITHUB_REF_NAME}"
          git push origin main
